name: Path filters
on:
    push:
      branches: 
        - main
      paths:
        - 'src/**'
        - Dockerfile
        - pom.xml
jobs:
    show-information:
        name: Push triggered info
        runs-on: ubuntu-latest
        steps:
          - name: Show triggered information
            run: |
              echo "*******************************"
              echo "Details of workflow"
              echo "Event name is : ${{ github.event_name }}"
              echo "Repository name is :${{ github.repository}}" 
              echo "Branch is : ${{github.ref_name}}"
              echo "Actor is : ${{github.actor}}"
              echo  "Commit SHA is : ${{github.sha}}"