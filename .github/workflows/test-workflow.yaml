name: list of files available in the repo
on:
  workflow_dispatch: 
jobs:
    list-files:
        runs-on: ubuntu-latest
        steps:
            - name: Location path
              run: |
                echo "current working directory:"
                pwd 
            - name: list of files
              run: | 
                echo "list of files in the repo:"
                ls -R
            - name: Give me the repo name printed
              run: |
                echo "Repository name is: https://github.com/${{github.repository}}.git"

                
