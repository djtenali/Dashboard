name: Dashboard-CI
on:
   push: 
    branches:
        - main
    paths:
    - 'src/**'
    - pom.xml
    - Dockerfile
   pull_request:
    branches:
    - main
    types:
    - opened
    - synchronize
    - reopened
   workflow_dispatch:
jobs:
    #-------------------jJob 1: Test--------------------
    test: # job-id > this can be later used if i want to refer
      name: Run Tests
      runs-on: ubuntu-latest
      steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run Tests
        run: mvn test
      - name: Upload Test Reports
        uses: actions/upload-artifact@v7
        with:
            name: surefire-reports
            path: target/surefire-reports/
            retention-days: 7

      
    
